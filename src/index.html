<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Inwordia</title>
  <link rel="stylesheet" href="index.css" />
</head>

<body class="">
  <div class="container">
    <div class="area-search">
      <svg class="brand-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
        <circle cx="45" cy="44" r="39" fill="#ffda6a" />
        <g class="eye">
          <path d="M18 46c0-9 6-15 14-15s14 6 14 15-6 15-14 15-14-6-14-15Z" fill="#fffdf8" stroke="#4a2638"
            stroke-width="3.5" />
          <ellipse class="pupil" cx="37" cy="47" rx="5.4" ry="7.2" fill="#4a2638" />
        </g>
        <circle cx="39" cy="44" r="2" fill="#fffdf8" />
        <circle cx="58" cy="45" r="19" fill="#ddf6f0" fill-opacity=".84" stroke="#4a2638" stroke-width="4.5" />
        <g class="eye">
          <path d="M48 46c0-6 4-10 10-10s10 4 10 10-4 10-10 10-10-4-10-10Z" fill="#fffdf8" stroke="#4a2638"
            stroke-width="2.5" />
          <g class="pupil">
            <ellipse cx="61" cy="47" rx="4.3" ry="5.7" fill="#4a2638" />
            <circle cx="62.5" cy="44.5" r="1.7" fill="#fffdf8" />
          </g>
        </g>
        <path d="m71.5 59.5 13 13" stroke="#4a2638" stroke-width="8" stroke-linecap="round" />
      </svg>
      <input id="keyword" type="text" autofocus />
    </div>
    <div id="fileList" hidden></div>
    <div id="settings" hidden>
      <div class="setting-header">
        <div id="brand">Settings</div>
        <div class="setting-nav">
          <span class="setting-menu-item active">Index</span>
          <span class="setting-menu-item">Hotkeys</span>
          <button id="btnWelcomeScreen">Welcome Screen</button>
        </div>
      </div>
      <div class="setting-item-container">
        
        <div class="setting-item active">
          <div class="setting-name">File Index</div>
          <div class="setting-contents">
            <div class="diskUsageInfo">
              <div id="diskUsageRatioChart"></div>
              <div>
                <div><span id="indexAmount">0</span><span> files indexed.</span></div>
                <div><span id="diskSpaceUsed">0</span><span> MB disk space used.</span></div>
              </div>
            </div>
            <div class="indexSelectionRow">
              <div class="indexSelections">
                <label for="indexPath">Index Path:</label>
                <div id="indexPath" class="index-box">
                  <div id="indexPathList" class="index-list"></div>
                  <div id="indexPathAction" class="index-actions">
                    <span id="indexPathAdd">+</span>
                    <span id="indexPathRemove">-</span>
                  </div>
                </div>
              </div>
              <div class="indexSelections">
                <label for="indexFileExtension">Index File Extension:</label>
                <div id="indexFileExtension" class="index-box">
                  <div id="indexFileExtensionList" class="index-list"></div>
                  <div id="indexFileExtensionAction" class="index-actions">
                    <span id="indexFileExtensionAdd">+</span>
                    <span id="indexFileExtensionRemove">-</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div><!-- end of Index -->
        
        <div class="setting-item">
          <div class="setting-name">Hotkeys</div>
          <div class="setting-contents">
            <div id="hotkeys" class="shortcutKeys">
              <span>Ctrl</span> + 
              <span class="shiftKey">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#000000" viewBox="0 0 16 16">
                  <path d="M7.27 2.047a1 1 0 0 1 1.46 0l6.345 6.77c.6.638.146 1.683-.73 1.683H11.5v3a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1v-3H1.654C.78 10.5.326 9.455.924 8.816zM14.346 9.5 8 2.731 1.654 9.5H4.5a1 1 0 0 1 1 1v3h5v-3a1 1 0 0 1 1-1z"/>
                </svg>
              </span> + 
              <span class="spaceKey">
                <svg fill="#000000" width="16" height="16" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" enable-background="new 0 0 24 24">
                  <path d="M21,9c-0.6,0-1,0.4-1,1v3H4v-3c0-0.6-0.4-1-1-1s-1,0.4-1,1v4c0,0.6,0.4,1,1,1h18c0.6,0,1-0.4,1-1v-4C22,9.4,21.6,9,21,9z" />
                </svg>
              </span>
            </div>
            <div id="hotkeys-message">Simply press the desired key combination on your keyboard to replace current keyboard shortcut with a new one to call me.</div>
          </div>
          <div class="setting-actions">
            <button id="btnHotkeysSave" class="primary">Save</button>
            <button id="btnHotkeysReset">Reset</button>
          </div>
        </div><!-- end of Hotkeys -->

      </div><!-- end of setting-item-container -->
    </div><!-- end of settings -->

    <div id="welcome" hidden>
      <div class="welcome-brand">Inwordia</div>
      <div id="welcome-indexSummary"></div>
      <div class="welcome-shortcutKeys">
        <div class="shortcutKeys">
          <span>Ctrl</span> + 
          <span class="shiftKey">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#000000" viewBox="0 0 16 16">
              <path d="M7.27 2.047a1 1 0 0 1 1.46 0l6.345 6.77c.6.638.146 1.683-.73 1.683H11.5v3a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1v-3H1.654C.78 10.5.326 9.455.924 8.816zM14.346 9.5 8 2.731 1.654 9.5H4.5a1 1 0 0 1 1 1v3h5v-3a1 1 0 0 1 1-1z"/>
            </svg>
          </span> + 
          <span class="spaceKey">
            <?xml version="1.0" encoding="utf-8"?>
            <svg fill="#000000" width="16" height="16" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"  enable-background="new 0 0 24 24">
              <path d="M21,9c-0.6,0-1,0.4-1,1v3H4v-3c0-0.6-0.4-1-1-1s-1,0.4-1,1v4c0,0.6,0.4,1,1,1h18c0.6,0,1-0.4,1-1v-4C22,9.4,21.6,9,21,9z" />
            </svg>
          </span>
          <div class="shortcutKeys-desc">to Open</div>
        </div>
        <div class="shortcutKeys">
          <span>ESC</span>
          <div class="shortcutKeys-desc">to Close (Minimize to Tray)</div>
        </div>
      </div>
      <div class="welcome-actions">
        <button id="btnSettings">Settings</button>
        <button id="welcome-ok" class="primary">OK</button>
      </div>
    </div><!-- end of Welcome screen -->
    
  </div>
  <!-- end of container -->
  <script src="./main.js"></script>
</body>

</html>
