<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" fill="none" role="img" aria-labelledby="title description">
  <title id="title">CherryQuery installation splash screen</title>
  <desc id="description">The CherryQuery logo above an indeterminate installation progress bar.</desc>
  <defs>
    <clipPath id="progress-clip">
      <rect x="210" y="291" width="220" height="6" rx="3"/>
    </clipPath>
  </defs>

  <rect width="640" height="400" fill="#F5F5F7"/>

  <g transform="translate(248 73) scale(1.5)">
    <circle cx="45" cy="44" r="39" fill="#FFDA6A"/>
    <path d="M18 46c0-9 6-15 14-15s14 6 14 15-6 15-14 15-14-6-14-15Z" fill="#FFFDF8" stroke="#4A2638" stroke-width="3.5"/>
    <ellipse cx="37" cy="47" rx="5.4" ry="7.2" fill="#4A2638"/>
    <circle cx="39" cy="44" r="2" fill="#FFFDF8"/>
    <circle cx="58" cy="45" r="19" fill="#DDF6F0" fill-opacity=".84" stroke="#4A2638" stroke-width="4.5"/>
    <path d="M48 46c0-6 4-10 10-10s10 4 10 10-4 10-10 10-10-4-10-10Z" fill="#FFFDF8" stroke="#4A2638" stroke-width="2.5"/>
    <ellipse cx="61" cy="47" rx="4.3" ry="5.7" fill="#4A2638"/>
    <circle cx="62.5" cy="44.5" r="1.7" fill="#FFFDF8"/>
    <path d="m71.5 59.5 13 13" stroke="#4A2638" stroke-width="8" stroke-linecap="round"/>
  </g>

  <rect x="210" y="291" width="220" height="6" rx="3" fill="#D8D8DC"/>
  <g clip-path="url(#progress-clip)">
    <rect x="130" y="291" width="80" height="6" rx="3" fill="#6E6E73">
      <animate attributeName="x" from="130" to="430" dur="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
